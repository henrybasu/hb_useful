name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  schedule:
    # Refresh build-time snapshots (headlines, etc.) daily ~12:00 UTC
    - cron: "0 12 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Build
        env:
          VITE_FINNHUB_KEY: ${{ secrets.VITE_FINNHUB_KEY }}
          GNEWS_KEY: ${{ secrets.VITE_GNEWS_KEY }}
        run: |
          npm ci
          npm run build

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
